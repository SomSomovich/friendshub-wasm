[package]
name = "friendshub-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "WASM bindings for libsignal-protocol v0.103.1, used by the FriendsHub web client."
repository = "https://github.com/SomSomovich/friendshub-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the exact tag native friendshub-core uses.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }

wasm-bindgen = "0.2"
js-sys = "0.3"
async-trait = "0.1"
rand = "0.9"
chacha20poly1305 = { version = "0.10", features = ["std"] }

# Three majors of getrandom are now in the graph. Cargo does not unify
# features across majors, so each must be told about the wasm backend:
#   - 0.2 (pulled by chacha20poly1305/rand_core) uses feature "js"
#   - 0.3 and 0.4 use feature "wasm_js" plus the cfg in .cargo/config.toml
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5", "v7", "rng-getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"